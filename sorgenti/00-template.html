<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City manager</title>
<style>
:root{--bg:#0f1620;--panel:rgba(16,24,34,.9);--line:rgba(140,180,220,.22);--fg:#e8eef5;--mute:#93a4b6;--acc:#4fb3a9;--acc2:#e8b04a;--bad:#e35d4f;--good:#5cc26a;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:14px}
button:hover{background:rgba(79,179,169,.25)}button.on{background:rgba(79,179,169,.45);border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
input[type=range]{accent-color:var(--acc)}
.hidden{display:none!important}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:6px 10px;background:linear-gradient(#0b1119ee,#0b111900);flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:flex;gap:6px;align-items:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}.chip button{padding:2px 7px;font-size:12px}.chip small{color:var(--mute)}
#cityName{font-weight:700;letter-spacing:.3px}
.dem{display:flex;align-items:flex-end;height:24px}
.dem i{display:block;width:10px;border-radius:2px;min-height:3px}
.demcol>span{font-size:10px;color:var(--mute);text-align:center;width:12px;display:block;line-height:1}
.demwrap{display:flex;gap:4px}
.demcol{display:flex;flex-direction:column;align-items:center;width:12px}
#cDem{padding:3px 8px}
#msbar{width:90px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}#msbar i{display:block;height:100%;background:var(--acc2)}
#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100vw - 20px)}
#toolbar{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;flex-wrap:wrap;justify-content:center}
#toolbar button{font-size:20px;padding:6px 9px;line-height:1}
#sub{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;gap:5px;flex-wrap:wrap;max-width:min(1100px,96vw);max-height:30vh;overflow:auto;justify-content:center}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:150px;text-align:left;padding:5px 7px}
.item .l{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .n{font-weight:600;font-size:13px}.item .c{color:var(--acc2);font-size:12px}.item .l{color:var(--mute);font-size:11px}
.subopts{display:flex;gap:6px;align-items:center;width:100%;justify-content:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px}
#side{position:fixed;right:8px;top:104px;width:340px;max-height:calc(100vh - 170px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
#side h3{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
#side .x{padding:2px 8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
.row span:first-child{color:var(--mute)}
.ltab{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}.ltab td,.ltab th{padding:3px 4px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}.ltab th{color:var(--mute);font-weight:500}.ltab i{display:inline-block;width:12px;height:12px;border-radius:3px}.ltab button{padding:1px 4px;margin:0 1px;font-size:12px}
.lschema{display:flex;align-items:flex-start;overflow-x:auto;padding:8px 0 4px;margin:4px 0;position:relative}.lschema span{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:46px;position:relative}.lschema span:before{content:'';position:absolute;top:6px;left:0;right:0;height:4px;background:var(--lc)}.lschema i{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--lc);position:relative;z-index:1;box-sizing:border-box}.lschema .wp i{width:9px;height:9px;border:none;background:var(--lc);transform:rotate(45deg);margin-top:3px}.lschema em{font-style:normal;font-size:10px;color:var(--mute);max-width:60px;text-align:center;line-height:1.1;margin-top:3px}.lschema .back{min-width:20px;color:var(--lc);font-size:14px}.lschema .back:before{display:none}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin:2px 0 6px}.bar i{display:block;height:100%}
.sec{margin:10px 0 4px;font-weight:700;color:var(--acc);font-size:13px;letter-spacing:.4px;text-transform:uppercase}
.slider{display:grid;grid-template-columns:1fr 110px 44px;gap:6px;align-items:center;padding:2px 0}
.slider input{width:100%}
#right{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
#right button{font-size:18px;padding:5px 8px}
#feed{position:fixed;left:8px;bottom:8px;width:290px;max-height:34vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px}
#feed .m{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}#feed .w{color:var(--acc);font-weight:600}
#feed h4{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between}
#tip{position:fixed;pointer-events:none;background:rgba(10,16,24,.92);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13px;display:none;z-index:50;max-width:320px}
#xpfeed{position:fixed;left:10px;bottom:calc(34vh + 26px);display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:40}
#xpfeed div{background:rgba(30,90,40,.88);color:#dfffd8;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600;animation:xpf 3.2s forwards}
@keyframes xpf{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:80}
#modal .box{background:var(--panel);border:1px solid var(--acc2);border-radius:14px;padding:18px 22px;max-width:min(520px,92vw);max-height:80vh;overflow:auto;text-align:center}
#modal h2{margin:4px 0 8px}#modal .ul{text-align:left;font-size:13.5px;columns:2;column-gap:18px;margin:10px 0}#modal button{margin:6px 4px;padding:7px 16px}
.req{display:block;background:#c8781a;color:#fff;border-radius:4px;padding:1px 5px;font-size:11px}
.warn{position:absolute;transform:translate(-50%,-100%);background:rgba(200,50,40,.92);color:#fff;border-radius:8px;padding:2px 7px;font-size:12px;white-space:nowrap;pointer-events:none}
#fpsBox{position:fixed;right:12px;bottom:12px;background:rgba(10,16,24,.8);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;z-index:55;display:none;pointer-events:none;color:var(--fg)}
#loadBar{position:fixed;left:16px;bottom:16px;width:300px;max-width:calc(100vw - 32px);background:rgba(10,16,24,.92);border:1px solid var(--acc2);border-radius:10px;padding:10px 12px;z-index:200;display:none;font-size:14px;color:var(--fg)}
#loadBar .lbT{margin-bottom:6px}
#loadBar .lbB{height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
#loadBar .lbF{height:100%;width:0;background:var(--acc2);transition:width .15s}
#toast{position:fixed;left:50%;top:74px;transform:translateX(-50%);background:rgba(10,16,24,.95);border:1px solid var(--acc2);border-radius:10px;padding:10px 18px;font-size:15px;display:none;z-index:60;max-width:80vw;text-align:center}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-start;padding-left:8vw;background:#000;overflow:hidden;z-index:100}
#menu .mbg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;will-change:opacity,transform;animation:menuRot 64s linear infinite}
#menu .pan{position:relative}
@keyframes menuRot{0%{opacity:0;transform:scale(1)}2.4%{opacity:1}14.8%{opacity:1}17.2%{opacity:0;transform:scale(1.06)}100%{opacity:0;transform:scale(1.06)}}
.pan{background:rgba(0,0,0,.55);backdrop-filter:blur(3px);border:1px solid rgba(255,200,140,.25);padding:26px 34px;border-radius:14px;min-width:340px;max-width:min(560px,90vw);max-height:88vh;overflow:auto}
.pan h1{margin:0 0 4px;font-size:34px;letter-spacing:.5px}.pan .sub{color:#d9c3a5;margin-bottom:20px}
.pan h2{margin:0 0 16px;font-size:24px}
.pan button.big{display:block;width:100%;margin:10px 0;padding:12px;font-size:18px;background:rgba(255,170,90,.18);border-color:rgba(255,190,120,.5)}
.pan button.big:hover{background:rgba(255,170,90,.4)}
.pan .r{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:12px 0;font-size:15px}
.pan input[type=text]{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--fg);padding:7px 9px;border-radius:7px;font-size:15px;width:200px}
.pan select{background:#1b2633;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px}
.slot{display:flex;gap:8px;align-items:center;margin:10px 0;background:rgba(255,255,255,.08);padding:8px 10px;border-radius:8px}
.slot .t{flex:1;font-size:14px;line-height:1.35}
.note{font-size:13px;color:#c9c0b4;margin-top:8px;line-height:1.5}
#legend{position:fixed;left:50%;transform:translateX(-50%);top:60px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;display:none}
#legend .g{display:inline-block;width:140px;height:9px;border-radius:4px;vertical-align:middle;margin:0 6px;background:linear-gradient(90deg,#2fbf4a,#e8d040,#e0402f)}
#labels,#streets{position:fixed;inset:0;pointer-events:none}
#hud,#infoside,#modalBox,#xpfeed{zoom:var(--uiz,1)}
#streets div{position:absolute;font-size:11px;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;opacity:.9}
#infoside{position:fixed;left:10px;top:100px;width:230px;background:var(--panel,rgba(20,26,34,.92));border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;font-size:13px;display:none;pointer-events:none;z-index:5}
#infoside .row{display:flex;justify-content:space-between;margin:3px 0}
#labels div{pointer-events:auto;cursor:pointer;position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000;white-space:nowrap;letter-spacing:1px}
#walkhint{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel);padding:6px 14px;border-radius:8px;display:none}
@media (max-width:700px){#side{width:auto;left:8px}#feed{display:none}}
#boot{position:fixed;inset:0;z-index:1000;background:#000;overflow:hidden;transition:opacity .6s}
#boot.off{opacity:0;pointer-events:none}
#boot .bi{position:absolute;inset:0;background-position:center,center;background-size:contain,cover;background-repeat:no-repeat;opacity:0;will-change:opacity,transform;animation:bootRot 21s linear infinite}
@keyframes bootRot{0%{opacity:0;transform:scale(1)}4%{opacity:1}17%{opacity:1}21%{opacity:0;transform:scale(1.05)}100%{opacity:0;transform:scale(1.05)}}
#boot .bb{position:absolute;left:0;right:0;bottom:0;padding:70px 6vw 34px;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center}
#boot .bt{font-size:clamp(26px,4vw,46px);font-weight:800;letter-spacing:2px;text-shadow:0 2px 10px #000}
#boot .bl{margin:14px auto 0;max-width:560px;height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;position:relative;box-shadow:0 1px 6px #000}
#boot .bf{position:absolute;inset:0;background:var(--acc2);transform-origin:left;transform:scaleX(.02);transition:transform .4s}
#boot .bs{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:bootSh 1.3s linear infinite}
@keyframes bootSh{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
#boot .bx{margin-top:9px;color:#e6edf4;font-size:15px;text-shadow:0 1px 4px #000}
</style>
</head>
<body>
<div id="boot"><!--BOOTIMG--><div class="bb"><div class="bt">City manager</div><div class="bl"><div class="bf" id="bootF"></div><div class="bs"></div></div><div class="bx" id="bootX">Caricamento…</div></div></div>
<script>
// schermata di caricamento: immagini a rotazione (le muove la scheda video, quindi girano anche mentre il gioco si carica)
(function () {
  var e = document.querySelectorAll('#boot .bi'), n = e.length, r = Math.floor(Math.random() * n);
  for (var k = 0; k < n; k++) e[k].style.animationDelay = (((k - r + n) % n) * 3.5 - 0.84) + 's';
  var en = false; try { en = (JSON.parse(localStorage.getItem('cityManager_settings')) || {}).lang === 'en'; } catch (x) {}
  if (en) document.getElementById('bootX').textContent = 'Loading…';
  window.bootP = function (f) { var b = document.getElementById('bootF'); if (b) b.style.transform = 'scaleX(' + Math.max(0.02, Math.min(1, f)) + ')'; };
  window.addEventListener('error', function (ev) { var x = document.getElementById('bootX'); if (x && typeof bootHide !== 'function') x.textContent = 'Errore: ' + ev.message; });
  window.addEventListener('load', function () { setTimeout(function () { if (typeof bootHide !== 'function') { var b = document.getElementById('boot'); if (b) b.style.display = 'none'; } }, 4000); });
})();
</script>
<canvas id="gl"></canvas>
<div id="labels"></div><div id="streets"></div><div id="infoside"></div><div id="warns"></div><div id="xpfeed"></div><div id="modal"><div class="box" id="modalBox"></div></div>
<div id="hud" class="hidden">
  <div id="top">
    <div class="chip" id="cityName"></div>
    <div class="chip" id="cMoney"></div>
    <div class="chip" id="cPop"></div>
    <div class="chip" id="cDate"></div>
    <div class="chip" id="cSpeed"></div>
    <div class="chip" id="cWeather"></div>
    <div class="chip" id="cMs"></div>
    <div class="chip demwrap" id="cDem"></div>
    <div class="chip" id="cHappy"></div>
    <div id="right"></div>
  </div>
  <div id="side" class="hidden"></div>
  <div id="feed"></div>
  <div id="legend"></div>
  <div id="bottom"><div id="sub" class="hidden"></div><div id="toolbar"></div></div>
  <div id="walkhint"></div>
</div>
<div id="tip"></div>
<div id="toast"></div>
<div id="menu"><!--MENUIMG--><div class="pan" id="menuPan"></div></div>
<script>/*THREE_LIB*/</script>
<script>bootP(THREE)</script>
<!--DATA--><script>
/*GAME*/
</script>
</body>
</html>
